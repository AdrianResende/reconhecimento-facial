{% extends "base.html" %}
{% block titulo %}Porta{% endblock %}
{% block conteudo %}
  <h2 style="margin-bottom:16px">Simulação de porta</h2>
  <div class="grade">
    <div class="video-wrap"><img src="{{ url_for('video_porta') }}" alt="câmera"></div>
    <div>
      {% include "_porta.html" %}
      <div class="painel" style="margin-top:16px">
        <h3>Últimos acessos</h3>
        <table id="acessos"><tr><td class="vazio">Nenhum acesso ainda.</td></tr></table>
      </div>
    </div>
  </div>

  <script>
    function linhaAcesso(a) {
      const quem = a.decisao === "liberado"
        ? `${esc(a.nome)} <span class="badge ${esc(a.papel)}">${esc(a.papel)}</span>`
        : "Desconhecido";
      const tag = a.decisao === "liberado"
        ? '<span class="tag VP">LIBERADO</span>' : '<span class="tag FN">NEGADO</span>';
      return `<tr><td>${a.hora}</td><td>${quem}</td><td>${tag}</td></tr>`;
    }
    async function atualizar() {
      try {
        const s = await (await fetch("{{ url_for('porta_status') }}")).json();
        atualizarPorta(s.porta);
        if (s.acessos.length)
          document.getElementById("acessos").innerHTML = s.acessos.map(linhaAcesso).join("");
      } catch (e) { /* servidor reiniciando: tenta de novo no próximo ciclo */ }
    }
    setInterval(atualizar, 400);
    atualizar();
  </script>
{% endblock %}
