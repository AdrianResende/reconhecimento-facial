{% extends "base.html" %}
{% block titulo %}Reconhecer{% endblock %}
{% block conteudo %}
  <h2 style="margin-bottom:16px">Reconhecimento em tempo real</h2>
  <div class="video-wrap"><img src="{{ url_for('video_reconhecer') }}" alt="câmera"></div>
  <div class="status-box" id="ultimo">Aguardando reconhecimento...</div>

  <script>
    setInterval(async () => {
      const r = await fetch("{{ url_for('reconhecer_status') }}");
      const s = await r.json();
      if (s.nome) {
        document.getElementById("ultimo").innerHTML =
          `Último confirmado: <strong>${s.nome}</strong> ` +
          `<span class="badge ${s.papel}">${s.papel}</span> às ${s.hora}`;
      }
    }, 1000);
  </script>
{% endblock %}
